# The environment of the routing tests (regression/routetest/README.md): this machine's a2p and the test accounts.
a2p.home=/usr/local/a2p
# the customer binds to MultiSmppServer1
server.host=172.19.4.38
server.port=16272
customer.user=rtcust
customer.password=rtpw
# every test vendor (RTV1..RTV9 in base/cm.cfg) binds to this port of the tool, system_id rtv1..rtv9
vendor.port=27001
vendor.bindWaitMs=180000
# MultiSmppClient1 and MultiSmppClient2 each bind every vendor
vendor.minLinks=2
vendor.dr=DELIVRD
vendor.drDelayMs=500
