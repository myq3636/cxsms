# RC011 逐级备份：每级按自己的规则选、每级只用一次、级别不连续、跳过已经发过的通道
# 用例清单：J-01 J-02 J-03 J-04 J-05 J-06 J-07 J-08 G-09
case.id=RC011
case.title=逐级备份：每级按自己的规则选、每级只用一次、级别不连续、跳过已经发过的通道
case.refs=J-01 J-02 J-03 J-04 J-05 J-06 J-07 J-08 G-09
vendors=rtv1,rtv2,rtv3,rtv4,rtv5,rtv6,rtv7,rtv9,rtv10,rtv11
vendor.rtv1.submitStatus=0x45
vendor.rtv2.submitStatus=0x45
vendor.rtv3.submitStatus=0x45
vendor.rtv4.submitStatus=0x45
vendor.rtv5.submitStatus=0x45
vendor.rtv7.submitStatus=0x45
vendor.rtv10.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# J-01、J-03、J-04：主 RTV1 失败 → 备份 1 Priority 20（OTP）RTV3 → 备份 2 RTV4 或 RTV5（只选一个）→ 备份 3 RTV6
mt.1=OTP|8615000001101|rtv1>rtv3>(rtv4|rtv5)>rtv6|[MT-REROUTE] level=1 from=9811 to=9813&&level=3&&by main backup3 prefix=all priority=10|DELIVRD
# J-02：BANK 在备份 1 走 Priority 10 的 RTV2
mt.2=BANK|8615000001102|rtv1>rtv2>(rtv4|rtv5)>rtv6|[MT-REROUTE] level=1 from=9811 to=9812|DELIVRD
# J-05、J-06：备份 1 只有 PAY 的规则不命中、备份 2 没有 44，直接到备份 3 的 44 组
mt.3=OTP|44770001103|rtv7>rtv9|[MT-REROUTE] level=3 from=9817 to=9819|DELIVRD
# J-07、J-08：备份 1 是发过的 RTV10，跳过；备份 2 只会选没发过的 RTV11
mt.4=OTP|64210001104|rtv10>rtv11|[MT-REROUTE] level=2 from=9820 to=9821|DELIVRD
# G-09：备份 1 的排除：PAY 不被排除，走 Priority 10 的 RTV6
mt.5=PAY|27820001105|rtv1>rtv6|[MT-REROUTE] level=1 from=9811 to=9816|DELIVRD
# G-09：BANK 被排除，走 Priority 20 的 RTV9
mt.6=BANK|27820001106|rtv1>rtv9|[MT-REROUTE] level=1 from=9811 to=9819|DELIVRD
