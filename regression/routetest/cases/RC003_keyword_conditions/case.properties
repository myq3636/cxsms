# RC003 内容关键字：KeywordId、ExcludeKeywordId、发送方+关键字（并且）
# 用例清单：F-04 F-05 F-08 G-06 G-08
case.id=RC003
case.title=内容关键字：KeywordId、ExcludeKeywordId、发送方+关键字（并且）
case.refs=F-04 F-05 F-08 G-06 G-08
vendors=rtv1,rtv2,rtv3,rtv4,rtv5,rtv6,rtv7
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# F-04：内容命中 RTK1
mt.1=OTP|8613800000301|rtv1|by main prefix=86 priority=10|DELIVRD
mt.1.text=your otp 1234
# G-06：内容命中 RTK2，被 Priority 20 排除，到 30
mt.2=OTP|8613800000302|rtv3|by main prefix=86 priority=30|DELIVRD
mt.2.text=promo big sale
# F-08：普通内容，Priority 20（没有排除）
mt.3=OTP|8613800000303|rtv2|by main prefix=86 priority=20|DELIVRD
mt.3.text=hello
# F-05：BANK 并且 RTK1
mt.4=BANK|44770000304|rtv4|by main prefix=44 priority=10|DELIVRD
mt.4.text=your otp 5678
# F-05：BANK 但不是 RTK1，不命中
mt.5=BANK|44770000305|rtv5|by main prefix=44 priority=20|DELIVRD
mt.5.text=hello
# F-05：RTK1 但不是 BANK，不命中
mt.6=OTP|44770000306|rtv5|by main prefix=44 priority=20|DELIVRD
mt.6.text=your otp 9
# G-08：BANK 且不是 RTK1
mt.7=BANK|64210000307|rtv6|by main prefix=64 priority=10|DELIVRD
mt.7.text=hello
# G-08：BANK 的验证码被排除
mt.8=BANK|64210000308|rtv7|by main prefix=64 priority=20|DELIVRD
mt.8.text=your otp 1
