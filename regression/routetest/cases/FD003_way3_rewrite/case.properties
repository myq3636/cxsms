# FD003 方式 3（真实 DR 不是 DELIVERED 时按比例改成成功）：比例 100 按前缀、UNDELIV / REJECTD 改写、前缀外和 DELIVRD 不改、外发失败不改、比例 70
# 用例清单：FN-07
case.id=FD003
case.title=方式 3（真实 DR 不是 DELIVERED 时按比例改成成功）：比例 100 按前缀、UNDELIV / REJECTD 改写、前缀外和 DELIVRD 不改、外发失败不改、比例 70
case.refs=FN-07
vendors=rtvf1,rtvf2,rtvf3,rtvf4,rtvf5
mt.drWaitMs=20000
vendor.rtvf4.submitStatus=0x45
vendor.rtvf5.submitStatus=0x0B
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# FN-07：UNDELIV 改成 DELIVRD；OUT_DELI_REP 10400、IN_DELI_REP 10000
mt.1=OTP|8613800004201|rtvf1|[DR-REWRITE] ossid=9897 from=10400 to=10000|DELIVRD
mt.1.customer=rtcf7
mt.1.vendorDr=UNDELIV
mt.1.drCount=1
mt.1.cdr=OUT_DELI_REP={id}@10400;IN_DELI_REP={id}@10000
# FN-07：REJECTD 也改写
mt.2=OTP|8613800004202|rtvf1|[DR-REWRITE] ossid=9897 from=|DELIVRD
mt.2.customer=rtcf7
mt.2.vendorDr=REJECTD
mt.2.drCount=1
# FN-07：8615 不在 SMSOptionDRSuccessRatioPrefix 里，不改
mt.3=OTP|8615000004203|rtvf1|![DR-REWRITE]|UNDELIV
mt.3.customer=rtcf7
mt.3.vendorDr=UNDELIV
mt.3.drCount=1
# 真实 DR 本来就是 DELIVRD，不用改
mt.4=OTP|8613800004204|rtvf1|![DR-REWRITE]|DELIVRD
mt.4.customer=rtcf7
mt.4.drCount=1
# 第 2 节：外发失败的 DR 不是真实 DR，不改写
mt.5=OTP|8619000004205|rtvf5|![DR-REWRITE]|!DELIVRD
mt.5.customer=rtcf7
mt.5.drCount=1
# FN-07：比例 70，100 条 UNDELIV 里约 70 条改成 DELIVRD（容差 12 个百分点）；改写的那些有 `[DR-REWRITE]`，没改的没有，所以不按条检查日志
mt.6=OTP|8613800004206|rtvf1||DELIVRD
mt.6.customer=rtcf8
mt.6.vendorDr=UNDELIV
mt.6.count=100
mt.6.drRatio=DELIVRD:70,tolerance=12
