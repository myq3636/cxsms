# PF002 高 TPS：5000 TPS 混合流量 1 小时；抓包（客户侧、通道侧）和 CDR 逐条对账，无多发、无丢失；之后空闲 10 分钟看内存
# 用例清单：docs/高TPS一致性和内存测试设计.md
case.id=PF002
case.title=5000 TPS 混合流量 1 小时：抓包和 CDR 逐条一致、无多发无丢失；Full GC 后的堆、线程、句柄、Metaspace 和 Redis 无过期 key
case.refs=docs/高TPS一致性和内存测试设计.md
vendors=rtvs1,rtvs2,rtvs3
customer.user=rtcs1
customer.rtcs3.port=16273
soak.tps=5000
soak.durationSec=3600
soak.warmupSec=300
soak.drainSec=120
soak.idleSec=600
soak.sampleSec=30
soak.binds=2
soak.reconnectSec=0
soak.reloadSec=0
mem.maxSlopeMBperHour=30
mem.growMB=20
mem.growPct=10
mem.retainMB=30
mem.retainPct=15
mem.threadGrowth=20
mem.fdGrowth=50
mem.metaGrowthMB=10
mem.redisNoTtlKeys=1000
mem.redisNoTtlPctOfSent=1
vendor.rtvs2.submitStatus=0x45
vendor.rtvs3.dr=none
# mt.N = 发送方 | 号码 | 预期通道 | Core 日志 | 客户收到的 DR（压测模式只用前两项和下面的 .customer .parts .weight）
# 普通 MT + DR（MultiSmppServer1）
mt.1=OTP|86138|*||
mt.1.customer=rtcs1
mt.1.weight=50
# 普通 MT + DR（MultiSmppServer2）
mt.2=OTP|86138|*||
mt.2.customer=rtcs3
mt.2.weight=15
# RTVS2 回 0x45，改道到备份 RTVS1
mt.3=OTP|86150|*||
mt.3.customer=rtcs1
mt.3.weight=10
# 3 段长短信
mt.4=OTP|86138|*||
mt.4.parts=3
mt.4.customer=rtcs1
mt.4.weight=10
# 没有路由：路由失败，失败 DR
mt.5=OTP|44770|*||
mt.5.customer=rtcs1
mt.5.weight=5
# RTVS3 不回 DR，客户 RTCS2 的假 DR 方式 4（5 秒）回成功
mt.6=OTP|86160|*||
mt.6.customer=rtcs2
mt.6.weight=10
