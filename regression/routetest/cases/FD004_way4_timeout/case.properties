# FD004 方式 4（通道 10 秒不回 DR 就自动回）：超时前真实 DR 到、超时回成功、超时后真实 DR 才到只记 CDR、状态 fail
# 用例清单：FN-08 FN-09
case.id=FD004
case.title=方式 4（通道 10 秒不回 DR 就自动回）：超时前真实 DR 到、超时回成功、超时后真实 DR 才到只记 CDR、状态 fail
case.refs=FN-08 FN-09
vendors=rtvf1,rtvf2,rtvf3,rtvf4,rtvf5
mt.drWaitMs=25000
vendor.rtvf4.submitStatus=0x45
vendor.rtvf5.submitStatus=0x0B
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# FN-08：真实 DR 0.5 秒就到，转发，计时取消，10 秒后不再回
mt.1=OTP|8613800004301|rtvf1|![FAKE-DR]|UNDELIV
mt.1.customer=rtcf9
mt.1.vendorDr=UNDELIV
mt.1.drCount=1
mt.1.drDelayMs=0,5000
# FN-09：通道不回 DR，约 10 秒后回成功
mt.2=OTP|8613800004302|rtvf1|[FAKE-DR] mode=TIMEOUT ossid=9899|DELIVRD
mt.2.customer=rtcf9
mt.2.vendorDr=none
mt.2.drCount=1
mt.2.drDelayMs=9000,16000
# FN-09：真实 DR 15 秒后才到：10 秒时回了成功，真实 UNDELIV 只记 OUT_DELI_REP
mt.3=OTP|8613800004303|rtvf1|[FAKE-DR] mode=TIMEOUT&&[DR-SKIP] outMsgId=|DELIVRD
mt.3.customer=rtcf9
mt.3.vendorDr=UNDELIV
mt.3.vendorDrDelayMs=15000
mt.3.drCount=1
mt.3.drDelayMs=9000,14000
mt.3.cdr=OUT_DELI_REP={id}@10400
# FN-09：SMSOptionFakeDRTimeoutStatus=fail
mt.4=OTP|8613800004304|rtvf1|[FAKE-DR] mode=TIMEOUT ossid=9900 rssid=9911 status=10400|UNDELIV
mt.4.customer=rtcf10
mt.4.vendorDr=none
mt.4.drCount=1
mt.4.drDelayMs=9000,16000
