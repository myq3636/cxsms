# GL002 外发的编码和拆分：7-bit 通道模式 1 / 2、默认通道按 ISO 140 拆、ForceTrans2ASCII、只配 MsgSplitLen 140 / 加 AsciiMsgSplitLen 160、data_coding 跟内容（DEF-C6）
# 用例清单：G7-07 G7-08 G7-10 G7-12 G7-13 G7-16 G7-17 G7-18 PD-02a PD-02h
case.id=GL002
case.title=外发的编码和拆分：7-bit 通道模式 1 / 2、默认通道按 ISO 140 拆、ForceTrans2ASCII、只配 MsgSplitLen 140 / 加 AsciiMsgSplitLen 160、data_coding 跟内容（DEF-C6）
case.refs=G7-07 G7-08 G7-10 G7-12 G7-13 G7-16 G7-17 G7-18 PD-02a PD-02h
vendors=rtvg1,rtvg2,rtvg3,rtvg4,rtvg5,rtvg6
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# G7-07、G7-12：7-bit 模式 1 的通道：1 段 160 字节，data_coding 0，GSM 编码；OUT_SUBMIT 字符集 ASCII
mt.1=OTP|8613800008101|rtvg1||DELIVRD
mt.1.customer=rtcg1
mt.1.enc=gsm7
mt.1.text=Café été
mt.1.length=160
mt.1.segLens=160
mt.1.vendorDc=0
mt.1.vendorEnc=gsm7
mt.1.vendorText=same
mt.1.cdr=OUT_SUBMIT={id}~"ASCII"
# G7-08：7-bit 模式 2 的通道：1 段，压缩成 140 字节
mt.2=OTP|8615000008102|rtvg2||DELIVRD
mt.2.customer=rtcg1
mt.2.enc=gsm7
mt.2.text=Café été
mt.2.length=160
mt.2.segLens=140
mt.2.vendorDc=0
mt.2.vendorEnc=gsm7packed
mt.2.vendorText=same
# G7-16、PD-02h、G7-12：默认通道（没配 7-bit、没配 MsgSplitLen）：去掉 7-bit 按 ISO 发，134 + 26 字节（每段 140 含 UDH），data_coding 3（改前是 0）；OUT_SUBMIT 字符集 ISO-8859-1
mt.3=OTP|8616000008103|rtvg3||DELIVRD
mt.3.customer=rtcg1
mt.3.enc=gsm7
mt.3.text=Café été
mt.3.length=160
mt.3.segLens=134,26
mt.3.vendorDc=3
mt.3.vendorText=same
mt.3.cdr=OUT_SUBMIT={id}~"ISO-8859-1"
# G7-10：ForceTrans2ASCII：按 ASCII 编码，é 变成 `?`（不是 e），1 段 160
mt.4=OTP|8619000008104|rtvg6||DELIVRD
mt.4.customer=rtcg1
mt.4.enc=gsm7
mt.4.text=Café été
mt.4.length=160
mt.4.segLens=160
mt.4.vendorText=ascii?
# G7-13b：data_coding 3，140 字节 ISO，默认通道：1 段
mt.5=OTP|8616000008105|rtvg3||DELIVRD
mt.5.customer=rtcust
mt.5.enc=latin1
mt.5.text=Café
mt.5.length=140
mt.5.segLens=140
mt.5.vendorDc=3
mt.5.vendorText=same
# G7-13c：ASCII 160，默认通道：1 段，data_coding 0
mt.6=OTP|8616000008106|rtvg3||DELIVRD
mt.6.customer=rtcust
mt.6.enc=ascii
mt.6.text=hello
mt.6.length=160
mt.6.segLens=160
mt.6.vendorDc=0
mt.6.vendorText=same
# G7-13a：data_coding 3，160 字节 ISO（客户不检查长度），默认通道没配 MsgSplitLen：按 140 拆（改前 160 一段）
mt.7=OTP|8616000008107|rtvg3||DELIVRD
mt.7.customer=rtcg3
mt.7.enc=latin1
mt.7.text=Café
mt.7.length=160
mt.7.segLens=134,26
mt.7.vendorDc=3
mt.7.vendorText=same
# G7-17：只配 MsgSplitLen 140：ASCII 160 也拆成 134 + 26（每段 140 字节含 6 字节 UDH）
mt.8=OTP|8617000008108|rtvg4||DELIVRD
mt.8.customer=rtcg1
mt.8.enc=gsm7
mt.8.text=hello
mt.8.length=160
mt.8.segLens=134,26
# G7-17：只配 MsgSplitLen 140：7-bit 带 é 160 拆成 134 + 26（每段 140 字节含 6 字节 UDH）
mt.9=OTP|8617000008109|rtvg4||DELIVRD
mt.9.customer=rtcg1
mt.9.enc=gsm7
mt.9.text=Café été
mt.9.length=160
mt.9.segLens=134,26
mt.9.vendorEnc=gsm7
mt.9.vendorText=same
# G7-18：再配 SMSOptionAsciiMsgSplitLen 160：ASCII 160 一段
mt.10=OTP|8618000008110|rtvg5||DELIVRD
mt.10.customer=rtcg1
mt.10.enc=gsm7
mt.10.text=hello
mt.10.length=160
mt.10.segLens=160
# G7-18：同上，7-bit 带 é 160 一段
mt.11=OTP|8618000008111|rtvg5||DELIVRD
mt.11.customer=rtcg1
mt.11.enc=gsm7
mt.11.text=Café été
mt.11.length=160
mt.11.segLens=160
mt.11.vendorEnc=gsm7
mt.11.vendorText=same
# G7-18：ISO 160（data_coding 3）仍按 MsgSplitLen 140 拆
mt.12=OTP|8618000008112|rtvg5||DELIVRD
mt.12.customer=rtcg3
mt.12.enc=latin1
mt.12.text=Café
mt.12.length=160
mt.12.segLens=134,26
mt.12.vendorDc=3
# PD-02a（DEF-C6）：UCS2 发往默认通道：data_coding 8（改前是 0）
mt.13=OTP|8616000008113|rtvg3||DELIVRD
mt.13.customer=rtcust
mt.13.enc=ucs2
mt.13.text=你好
mt.13.vendorDc=8
mt.13.vendorText=same
