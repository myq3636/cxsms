# RC009 主路由选不出能用的通道时，选路时就从备份找：长度不允许、通道不存在、没有主路由规则；备份也没有才路由失败
# 用例清单：I-01 I-02 I-03 I-06 Q-04
case.id=RC009
case.title=主路由选不出能用的通道时，选路时就从备份找：长度不允许、通道不存在、没有主路由规则；备份也没有才路由失败
case.refs=I-01 I-02 I-03 I-06 Q-04
vendors=rtvlen,rtv1,rtv2,rtv3,rtv4,rtv5
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 短内容，主路由的 RTVLEN 允许
mt.1=OTP|8613800000901|rtvlen|by main prefix=8613 priority=10|DELIVRD
mt.1.text=hi
# I-02：内容超过 50 字节，RTVLEN 不允许，选路时用备份 1，routingLevel=1
mt.2=OTP|8613800000902|rtv2|content length not allowed by channel 9840&&by main backup1 prefix=86 priority=10|DELIVRD
mt.2.text=this content is longer than the fifty bytes RTVLEN allows
# I-01：主路由的通道 RTVXX 不在 cm.cfg，用备份 1（WARN）
mt.3=OTP|8615000000903|rtv2|channel -1 not in cm.cfg&&by main backup1 prefix=86 priority=10|DELIVRD
# I-06：没有 64 的主路由规则，用备份 1
mt.4=OTP|64210000904|rtv3|no main routing rule matched&&by main backup1 prefix=64 priority=10|DELIVRD
# 没有主路由，也没有备份：路由失败，失败 DR
mt.5=OTP|27820000905|none|no backup route either|!DELIVRD
# I-03：40 条，Relay=RTV4:50,RTVXX:50，抽到不存在的 RTVXX 时不换 RTV4，而是用备份 RTV5：两个都收到，各一半左右
mt.6=OTP|85268000906|rtv4|rtv5||DELIVRD
mt.6.count=40
mt.6.ratio=rtv4:50,rtv5:50,tolerance=20
check.log.1=CoreEngine1|Relay channel RTVXX is not in cm.cfg
