# PP001 消息经过的模块：Server / Core / Client 日志的 path、CDR 的 DeliveryChannel；两个 Server、改道、Core 生成的失败 DR、长短信
# 用例清单：设计稿第 4 节；PathChainIT PC-05～PC-12 在服务器上的对应
case.id=PP001
case.title=消息经过的模块：Server / Core / Client 日志的 path、CDR 的 DeliveryChannel；两个 Server、改道、Core 生成的失败 DR、长短信
case.refs=设计稿第 4 节；PathChainIT PC-05～PC-12 在服务器上的对应
vendors=rtvp1,rtvp2
customer.rtcpp.port=16273
vendor.rtvp1.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# PC-05～PC-12：经过 MultiSmppServer1 的 MT 和它的 DR，日志 4 处、CDR 4 种
mt.1=OTP|8613800006001|rtvp2|{CoreEngine}~MT-TO-CLIENT].* path=MultiSmppServer1>CoreEngine[1-3](?![^ ])&&{MultiSmppClient}~MT-OUT].* path=MultiSmppServer1>CoreEngine[1-3]>MultiSmppClient[12](?![^ ])&&{CoreEngine}~DR-TO-SERVER].* path=MultiSmppClient[12]>CoreEngine[1-3](?![^ ])&&{MultiSmppServer}~DR-OUT].* path=MultiSmppClient[12]>CoreEngine[1-3]>MultiSmppServer1(?![^ ])|DELIVRD
mt.1.cdr=IN_SUBMIT={id}~"MultiSmppServer1:CoreEngine[1-3]";OUT_SUBMIT={id}~"MultiSmppServer1:CoreEngine[1-3]:MultiSmppClient[12]:CoreEngine[1-3]";OUT_DELI_REP={id}~"MultiSmppClient[12]:CoreEngine[1-3]";IN_DELI_REP={id}~"MultiSmppClient[12]:CoreEngine[1-3]:MultiSmppServer1:CoreEngine[1-3]"
# 同上，经过 MultiSmppServer2；DR 回到 MultiSmppServer2
mt.2=OTP|8613800006002|rtvp2|{CoreEngine}~MT-TO-CLIENT].* path=MultiSmppServer2>CoreEngine[1-3](?![^ ])&&{MultiSmppClient}~MT-OUT].* path=MultiSmppServer2>CoreEngine[1-3]>MultiSmppClient[12](?![^ ])&&{CoreEngine}~DR-TO-SERVER].* path=MultiSmppClient[12]>CoreEngine[1-3](?![^ ])&&{MultiSmppServer}~DR-OUT].* path=MultiSmppClient[12]>CoreEngine[1-3]>MultiSmppServer2(?![^ ])|DELIVRD
mt.2.customer=rtcpp
mt.2.cdr=IN_SUBMIT={id}~"MultiSmppServer2:CoreEngine[1-3]";OUT_SUBMIT={id}~"MultiSmppServer2:CoreEngine[1-3]:MultiSmppClient[12]:CoreEngine[1-3]";OUT_DELI_REP={id}~"MultiSmppClient[12]:CoreEngine[1-3]";IN_DELI_REP={id}~"MultiSmppClient[12]:CoreEngine[1-3]:MultiSmppServer2:CoreEngine[1-3]"
# 改道：第二次外发的路径接着第一次（Client → Core 处理结果 → 另一次 Client）
mt.3=OTP|8615000006003|rtvp1>rtvp2|{MultiSmppClient}~MT-OUT].* path=MultiSmppServer1>CoreEngine[1-3]>MultiSmppClient[12](?![^ ])&&{MultiSmppClient}~MT-OUT].* path=MultiSmppServer1>CoreEngine[1-3]>MultiSmppClient[12]>CoreEngine[1-3]>MultiSmppClient[12](?![^ ])|DELIVRD
mt.3.cdr=OUT_SUBMIT={id}-9942~"MultiSmppServer1:CoreEngine[1-3]:MultiSmppClient[12]:CoreEngine[1-3]:MultiSmppClient[12]:CoreEngine[1-3]"
# 路由失败，Core 生成的失败 DR 带着 MT 的路径（不是从 Client 开始）
mt.4=OTP|447700006004|none|no backup route either&&{CoreEngine}~DR-TO-SERVER].* path=MultiSmppServer1>CoreEngine[1-3](?![^ ])&&{MultiSmppServer}~DR-OUT].* path=MultiSmppServer1>CoreEngine[1-3]>MultiSmppServer1(?![^ ])|!DELIVRD
# 长短信 3 段：Core 拼好再拆分发出，每段的 [MT-OUT] 都有路径
mt.5=OTP|8613800006005|rtvp2|{MultiSmppClient}~MT-OUT].* path=MultiSmppServer1>CoreEngine[1-3]>MultiSmppClient[12](?![^ ])|DELIVRD
mt.5.parts=3
mt.5.segments=rtvp2:3
