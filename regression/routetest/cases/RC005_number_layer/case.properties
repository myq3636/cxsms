# RC005 号码层：完全相等、多个号码、同一号码按优先级、号码层先于前缀、号码带 +
# 用例清单：B-02 B-09 C-01 C-02 C-03 C-04
case.id=RC005
case.title=号码层：完全相等、多个号码、同一号码按优先级、号码层先于前缀、号码带 +
case.refs=B-02 B-09 C-01 C-02 C-03 C-04
vendors=rtv1,rtv2,rtv3,rtv4,rtv9
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# B-02：号码层先于普通层（普通层 BANK 会走 RTV5）
mt.1=BANK|8613800000501|rtv1|by number number=8613800000501 priority=1|DELIVRD
# C-02：同一条规则的第二个号码
mt.2=OTP|8613800000502|rtv1|by number number=8613800000502 priority=1|DELIVRD
# C-03：同一号码 BANK 的 Priority 1
mt.3=BANK|8613800000503|rtv2|by number number=8613800000503 priority=1|DELIVRD
# C-03：其他发送方 Priority 2
mt.4=OTP|8613800000503|rtv3|by number number=8613800000503 priority=2|DELIVRD
# B-09：号码层有规则，但没有这个号码，看普通层
mt.5=OTP|8613800000504|rtv9|by main prefix=86 priority=50|DELIVRD
# C-01：比规则里的号码多一位，不算命中
mt.6=OTP|86138000005010|rtv9|by main prefix=86 priority=50|DELIVRD
# C-04：号码带 +，去掉后比较
mt.7=OTP|+8613800000599|rtv4|by number number=8613800000599 priority=1|DELIVRD
