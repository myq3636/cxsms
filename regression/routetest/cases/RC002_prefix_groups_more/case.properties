# RC002 前缀分组：三级前缀、宽泛规则优先级更小、长前缀不命中退到短前缀、多前缀规则、数字发送方完全相等
# 用例清单：E-05 E-06 E-07 E-09 E-10 E-11 F-01 F-03 F-06
case.id=RC002
case.title=前缀分组：三级前缀、宽泛规则优先级更小、长前缀不命中退到短前缀、多前缀规则、数字发送方完全相等
case.refs=E-05 E-06 E-07 E-09 E-10 E-11 F-01 F-03 F-06
vendors=rtv1,rtv2,rtv3,rtv4,rtv6,rtv8,rtv9,rtv10,rtv11,rtv12
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 三级前缀，最长的 8613
mt.1=OTP|8613800000201|rtv1|by main prefix=8613 priority=30|DELIVRD
# 没有 8612 组，退到 861
mt.2=OTP|8612000000202|rtv2|by main prefix=861 priority=30|DELIVRD
# 退到 86
mt.3=OTP|8620000000203|rtv3|by main prefix=86 priority=30|DELIVRD
# E-05：8619 组里不带条件的 Priority 2 先于 BANK 的 Priority 5
mt.4=BANK|8619000000204|rtv6|by main prefix=8619 priority=2|DELIVRD
# 8617 组 BANK 命中
mt.5=BANK|8617000000205|rtv8|by main prefix=8617 priority=10|DELIVRD
# E-06：8617 组只有 BANK 的规则，OTP 退到 861
mt.6=OTP|8617000000206|rtv2|by main prefix=861 priority=30|DELIVRD
# E-11：一条规则的两个前缀 64、27
mt.7=PAY|64210000207|rtv9|by main prefix=64 priority=10|DELIVRD
# E-11：同一条规则的 27
mt.8=PAY|27820000208|rtv9|by main prefix=27 priority=10|DELIVRD
# F-06：64 只有 PAY 的规则，OTP 到 all
mt.9=OTP|64210000209|rtv12|by main prefix=all priority=50|DELIVRD
# F-03：数字发送方完全相等
mt.10=10690001|8616000000210|rtv10|by main prefix=8616 priority=1|DELIVRD
# F-03：多一位不算命中（不是前缀匹配）；E-09 优先级 97 不连续
mt.11=106900012|8616000000211|rtv11|by main prefix=8616 priority=97|DELIVRD
# E-10：前缀和整个号码一样长，命中
mt.12=OTP|8618000000212|rtv4|by main prefix=8618000000212 priority=10|DELIVRD
