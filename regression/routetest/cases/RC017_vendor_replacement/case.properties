# RC017 系统路由替换：选通道时替换；“发过”和改道码看替换后的通道；客户级替换优先；只换一次；替换成不存在的通道
# 用例清单：M-01 M-02 M-03 M-04 M-05 M-06 M-07 M-08 M-09 P-05 P-06
case.id=RC017
case.title=系统路由替换：选通道时替换；“发过”和改道码看替换后的通道；客户级替换优先；只换一次；替换成不存在的通道
case.refs=M-01 M-02 M-03 M-04 M-05 M-06 M-07 M-08 M-09 P-05 P-06
vendors=rtv2,rtv4,rtv8
vendor.rtv2.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# M-01、M-02、M-03：主路由 RTV1 被替换成 RTV2 发出；RTV2 失败（看 RTV2 的重试码）；备份 1 的 RTV1 又被替换成发过的 RTV2，跳过；备份 2 的 RTV3 按客户级替换成 RTV4（M-09，不是 -1 的 RTV6），而且不再按 9814:9815 换（M-08）
mt.1=OTP|8613800001701|rtv2>rtv4|rule=9811 replaced=9812&&[MT-REROUTE] level=2 from=9812 to=9814|DELIVRD
mt.1.cdr=OUT_SUBMIT={id};OUT_SUBMIT={id}-9814
# M-09：客户级替换优先
mt.2=OTP|8615000001702|rtv4|rule=9813 replaced=9814|DELIVRD
# M-06：主路由 RTV7 被替换成不存在的 9999：选路时从备份 1 找
mt.3=OTP|64210001703|rtv8|channel 9999 not in cm.cfg&&by main backup1 prefix=64 priority=10|DELIVRD
