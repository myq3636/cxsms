# MEM001 内存泄漏：100 TPS 混合流量 55 分钟（含 5 分钟预热）+ 客户重连 + reload，之后空闲 10 分钟；看各模块 Full GC 后的堆、线程、句柄、Metaspace 和 Redis 无过期 key
# 用例清单：docs/内存泄漏测试设计.md
case.id=MEM001
case.title=内存泄漏：100 TPS 混合流量 55 分钟（含 5 分钟预热）+ 客户重连 + reload，之后空闲 10 分钟；看各模块 Full GC 后的堆、线程、句柄、Metaspace 和 Redis 无过期 key
case.refs=docs/内存泄漏测试设计.md
vendors=rtvs1,rtvs2,rtvs3
customer.user=rtcs1
customer.rtcs3.port=16273
soak.tps=100
soak.durationSec=3300
soak.warmupSec=300
soak.drainSec=60
soak.idleSec=600
soak.sampleSec=30
soak.reconnectSec=300
soak.reloadSec=600
soak.reloadCmds=RELOAD_ROUTING:-f,RELOAD_CUSTOMER,RELOAD_DRERROR,RELOAD_GMMS_CONFIG
mem.maxSlopeMBperHour=30
mem.growMB=20
mem.growPct=10
mem.retainMB=30
mem.retainPct=15
mem.threadGrowth=20
mem.fdGrowth=50
mem.metaGrowthMB=10
mem.redisNoTtlKeys=1000
mem.redisNoTtlPctOfSent=1
vendor.rtvs2.submitStatus=0x45
vendor.rtvs3.dr=none
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 普通 MT + DR（MultiSmppServer1）
mt.1=OTP|86138|*||
mt.1.customer=rtcs1
mt.1.weight=50
# 普通 MT + DR（MultiSmppServer2）
mt.2=OTP|86138|*||
mt.2.customer=rtcs3
mt.2.weight=15
# RTVS2 回 0x45，改道到备份 RTVS1
mt.3=OTP|86150|*||
mt.3.customer=rtcs1
mt.3.weight=10
# 3 段长短信
mt.4=OTP|86138|*||
mt.4.parts=3
mt.4.customer=rtcs1
mt.4.weight=10
# 没有路由：路由失败，失败 DR
mt.5=OTP|44770|*||
mt.5.customer=rtcs1
mt.5.weight=5
# RTVS3 不回 DR，客户 RTCS2 的假 DR 方式 4（5 秒）回成功
mt.6=OTP|86160|*||
mt.6.customer=rtcs2
mt.6.weight=10
