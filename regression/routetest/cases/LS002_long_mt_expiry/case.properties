# LS002 长短信没集齐：CsmIntegrityCacheTimeout 到期后过期扫描给已收到的每段回失败 DR，不外发，合并缓冲删掉
# 用例清单：流程说明第 4 节（没集齐就过期）；配置项说明 CsmIntegrityCacheTimeout、CoreCsmExpirySweep
case.id=LS002
case.title=长短信没集齐：CsmIntegrityCacheTimeout 到期后过期扫描给已收到的每段回失败 DR，不外发，合并缓冲删掉
case.refs=流程说明第 4 节（没集齐就过期）；配置项说明 CsmIntegrityCacheTimeout、CoreCsmExpirySweep
vendors=rtvl1,rtvl2,rtvl3
mt.drWaitMs=120000
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 只发第 1、3 段：过期，2 条失败 DR
mt.1=OTP|8613800009101|none||!DELIVRD
mt.1.parts=3
mt.1.dropSeg=2
mt.1.drCount=2
mt.1.drEachSeg=true
mt.1.waitMs=120000
# 对照：完整的 3 段照常外发
mt.2=OTP|8613800009102|rtvl1||DELIVRD
mt.2.parts=3
mt.2.segments=rtvl1:3
mt.2.drCount=3
mt.2.drEachSeg=true
mt.2.waitMs=120000
check.cmd.1=$RTREDIS --scan --pattern 'csm:9801:OTP:8613800009101:*' | wc -l => =0
check.cmd.2=$RTREDIS --scan --pattern 'csm:ids:9801:OTP:8613800009101:*' | wc -l => =0
