# BT004 配了 bind 级：一个 bind 回响应慢（窗口 5 很快满），改用同一连接里的另一个 bind，100 条约 2 秒发完
# 用例清单：BR-09a
case.id=BT004
case.title=配了 bind 级：一个 bind 回响应慢（窗口 5 很快满），改用同一连接里的另一个 bind，100 条约 2 秒发完
case.refs=BR-09a
vendors=rtvb4
vendor.rtvb4.minLinks=4
vendor.rtvb4.slowFirstLink=true
vendor.rtvb4.respDelayMs=3000
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 100 条，每 10 ms 一条
mt.1=OTP|8613800007301|rtvb4||DELIVRD
mt.1.count=100
mt.1.after=10
mt.1.bindsUsed=2
mt.1.spanMs=0,3500
