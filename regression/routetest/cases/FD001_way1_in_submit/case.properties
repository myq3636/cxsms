# FD001 方式 1（收到客户消息就回）：全部 / 按前缀、延迟、之后的真实 DR 和外发失败只记 CDR、前缀外的失败照常回（DEF-C8）、比例 0 和 90±5、路由失败仍是失败 DR
# 用例清单：FN-01 FN-02 FN-03 FN-04
case.id=FD001
case.title=方式 1（收到客户消息就回）：全部 / 按前缀、延迟、之后的真实 DR 和外发失败只记 CDR、前缀外的失败照常回（DEF-C8）、比例 0 和 90±5、路由失败仍是失败 DR
case.refs=FN-01 FN-02 FN-03 FN-04
vendors=rtvf1,rtvf2,rtvf3,rtvf4,rtvf5
mt.drWaitMs=20000
vendor.rtvf4.submitStatus=0x45
vendor.rtvf5.submitStatus=0x0B
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# FN-02：全部号码，假 DR 成功；通道真实 DR 被跳过；只有 1 条
mt.1=OTP|8613800004001|rtvf1|[FAKE-DR] mode=IN_SUBMIT ossid=9891 rssid=9911 status=10000&&[DR-SKIP] ossid=9891 status=10000|DELIVRD
mt.1.customer=rtcf1
mt.1.drCount=1
mt.1.cdr=OUT_SUBMIT={id};OUT_DELI_REP={id}@10000
# FN-03：真实 DR 是 UNDELIV，客户仍只有那条成功的假 DR，OUT_DELI_REP 记真实的 10400
mt.2=OTP|8613800004002|rtvf1|[FAKE-DR] mode=IN_SUBMIT&&[DR-SKIP] ossid=9891 status=10400|DELIVRD
mt.2.customer=rtcf1
mt.2.vendorDr=UNDELIV
mt.2.drCount=1
mt.2.cdr=OUT_DELI_REP={id}@10400
# FN-03：外发失败（0x0B，不重试），客户只有假 DR
mt.3=OTP|8619000004003|rtvf5|[FAKE-DR] mode=IN_SUBMIT|DELIVRD
mt.3.customer=rtcf1
mt.3.drCount=1
# FN-02：按前缀 8613，延迟 2～4 秒
mt.4=OTP|8613800004004|rtvf1|[FAKE-DR] mode=IN_SUBMIT ossid=9892&&delaySec=|DELIVRD
mt.4.customer=rtcf2
mt.4.drCount=1
mt.4.drDelayMs=1500,7000
# FN-02：852 不在前缀里，不回假 DR，真实 DR 转发
mt.5=OTP|85268000405|rtvf1|![FAKE-DR]|UNDELIV
mt.5.customer=rtcf2
mt.5.vendorDr=UNDELIV
mt.5.drCount=1
# FN-03、DEF-C8：前缀外的号码，可重试的失败（0x45 → 2300）重试到最后一次（策略只有 1 个点）：客户收到失败 DR
mt.6=OTP|85269000406|rtvf4|![FAKE-DR]|!DELIVRD
mt.6.customer=rtcf2
mt.6.drCount=1
# FN-04：SMSOptionFakeDRSuccessRatio=0，假 DR 全是失败（真实 DR 是成功也不转发）
mt.7=OTP|8613800004007|rtvf1|[FAKE-DR] mode=IN_SUBMIT ossid=9893 rssid=9911 status=10400|UNDELIV
mt.7.customer=rtcf3
mt.7.drCount=1
# FN-04：比例 90、浮动 5，100 条里成功的约 85%～95%（容差按 10 个百分点，留出抽样误差）
mt.8=OTP|8613800004008|rtvf1|[FAKE-DR] mode=IN_SUBMIT ossid=9894|DELIVRD
mt.8.customer=rtcf4
mt.8.count=100
mt.8.drRatio=DELIVRD:90,tolerance=10
# FN-01：路由失败的消息到不了方式 1，仍是失败 DR
mt.9=OTP|447700004009|none|no backup route either&&![FAKE-DR]|!DELIVRD
mt.9.customer=rtcf1
mt.9.drCount=1
