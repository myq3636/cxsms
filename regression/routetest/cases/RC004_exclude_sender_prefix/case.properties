# RC004 排除条件：ExcludeSender（不区分大小写）、退到短前缀和 all、ExcludePhonePrefix、排除的 DEBUG 日志
# 用例清单：G-01 G-02 G-03 G-05 G-07 G-11
case.id=RC004
case.title=排除条件：ExcludeSender（不区分大小写）、退到短前缀和 all、ExcludePhonePrefix、排除的 DEBUG 日志
case.refs=G-01 G-02 G-03 G-05 G-07 G-11
vendors=rtv1,rtv2,rtv3,rtv4,rtv5,rtv9
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# G-01：PAY 不在排除里
mt.1=PAY|8620000000401|rtv1|by main prefix=86 priority=10|DELIVRD
# G-01、G-11：BANK 被排除，同组下一条；DEBUG 日志写明排除条件
mt.2=BANK|8620000000402|rtv2|not matched by ExcludeSender=bank&&by main prefix=86 priority=20|DELIVRD
# G-05：排除不区分大小写
mt.3=otp|8620000000403|rtv2|by main prefix=86 priority=20|DELIVRD
# 8613 组
mt.4=OTP|8613800000404|rtv3|by main prefix=8613 priority=10|DELIVRD
# G-02：8613 排除了 PAY，退到 86（PAY 在 86 的 Priority 10 不被排除）
mt.5=PAY|8613800000405|rtv1|by main prefix=86 priority=10|DELIVRD
# 852 组
mt.6=OTP|85268000406|rtv4|by main prefix=852 priority=10|DELIVRD
# G-07：85269 被排除，852 组没有下一条，到 all
mt.7=OTP|85269000407|rtv9|not matched by ExcludePhonePrefix=85269&&by main prefix=all priority=50|DELIVRD
# G-03：64 组只有排除 BANK 的规则，BANK 到 all
mt.8=BANK|64210000408|rtv9|by main prefix=all priority=50|DELIVRD
# 64 组
mt.9=OTP|64210000409|rtv5|by main prefix=64 priority=10|DELIVRD
