# RC020 RELOAD_ROUTING：一个文件写错只有它失败、保留原来的路由，其他文件照常生效；旧配置名 WARN 不生效
# 用例清单：A-08 A-15 A-17 A-18 A-20
case.id=RC020
case.title=RELOAD_ROUTING：一个文件写错只有它失败、保留原来的路由，其他文件照常生效；旧配置名 WARN 不生效
case.refs=A-08 A-15 A-17 A-18 A-20
vendors=rtv1,rtv2
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 第 1 阶段：RTCUST 的正确文件
mt.1=OTP|8613800002001|rtv1|by main prefix=86 priority=10 file=RTCUST|DELIVRD
phase.2.afterMs=0
phase.2.reload=RELOAD_ROUTING
# A-18：RTCUST 的新文件有错（同一前缀两条 Priority 10），这个文件失败、保留原来的路由 RTV1（不是 RTV3）
mt2.1=OTP|8613800002002|rtv1|by main prefix=86 priority=10 file=RTCUST|DELIVRD
# A-17、A-15：RTCUST7 的新文件生效；旧的 A2PRoutingRelay 不生效（不走 RTV5）
mt2.2=OTP|8613800002003|rtv2|by main prefix=86 priority=10 file=RTCUST7|DELIVRD
mt2.2.customer=rtcust7
check.log.1=CoreEngine1|routing file RTCUST not loaded, it keeps its previous routing
check.log.2=CoreEngine1|have the same Priority=10 for 86
check.log.3=CoreEngine1|A2PRoutingRelay: the old routing config name is not used any more
check.redis.1=routingInfoCoreEngine1.Rules:RTCUST|main:0:86:10|"Relay":"9811"
check.redis.2=routingInfoCoreEngine1.Rules:RTCUST7|main:0:86:10|"Relay":"9812"
check.redis.3=routingInfoCoreEngine1.Rules:RTCUST7|_warnings|A2PRoutingRelay
