# PF001 DB 积压：wdq、rdq 各 50 万行前后，同样 50 TPS 的流量，比较 MT 和 DR 的延迟，找出变慢的原因
# 用例清单：docs/DB积压性能测试设计.md
case.id=PF001
case.title=DB 积压：wdq、rdq 各 50 万行前后，同样 50 TPS 的流量，比较 MT 和 DR 的延迟，找出变慢的原因
case.refs=docs/DB积压性能测试设计.md
vendors=rtvq1,rtvq2
customer.user=rtcq1
customer.rtcq2.drResp=false
soak.tps=50
soak.durationSec=360
soak.warmupSec=60
soak.drainSec=60
soak.idleSec=0
soak.memwatch=false
vendor.rtvq2.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 普通 MT + DR（每条 DR 都会 DELETE FROM WDQ）
mt.1=OTP|86138|*||
mt.1.customer=rtcq1
mt.1.weight=70
# RTVQ2 回 0x45，改道到 RTVQ1
mt.2=OTP|86150|*||
mt.2.customer=rtcq1
mt.2.weight=10
# 3 段长短信
mt.3=OTP|86138|*||
mt.3.parts=3
mt.3.customer=rtcq1
mt.3.weight=10
# 客户不回 deliver_sm_resp：DR 进 RDQ，MQM 重发
mt.4=OTP|86138|*||
mt.4.customer=rtcq2
mt.4.weight=10
