# RC008 Relay：权重 70/30、轮流、; 后面不生效
# 用例清单：H-01 H-02 H-03 H-04
case.id=RC008
case.title=Relay：权重 70/30、轮流、; 后面不生效
case.refs=H-01 H-02 H-03 H-04
vendors=rtv1,rtv2,rtv3,rtv4,rtv5,rtv6,rtv8,rtv9
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# H-01：200 条（同一号码，一个 Core 处理），比例 70/30 左右
mt.1=OTP|8613800000801|rtv1|rtv2|by main prefix=86 priority=10|DELIVRD
mt.1.count=200
mt.1.ratio=rtv1:70,rtv2:30,tolerance=10
# H-02：9 条（同一号码），轮流各 3 条
mt.2=OTP|64210000802|rtv3|rtv4|rtv5|by main prefix=64 priority=10|DELIVRD
mt.2.count=9
mt.2.ratio=rtv3:33.3,rtv4:33.3,rtv5:33.3,tolerance=0.1
# H-03：Relay=RTV6;RTV7 只用 RTV6
mt.3=OTP|27820000803|rtv6|by main prefix=27 priority=10|DELIVRD
# H-04：20 条，权重 0 的 RTV9 一条也收不到
mt.4=OTP|44770000804|rtv8|by main prefix=44 priority=10|DELIVRD
mt.4.count=20
mt.4.ratio=rtv8:100,rtv9:0,tolerance=0
check.log.1=CoreEngine1|Relay=RTV6;RTV7: the part after ';' is not used
