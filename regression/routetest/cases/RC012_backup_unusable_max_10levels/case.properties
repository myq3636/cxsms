# RC012 备份的通道不存在跳到下一级；走满 10 级；SMSOptionMaxReroute
# 用例清单：J-09 J-10 J-15 J-16 J-17 K-09
case.id=RC012
case.title=备份的通道不存在跳到下一级；走满 10 级；SMSOptionMaxReroute
case.refs=J-09 J-10 J-15 J-16 J-17 K-09
vendors=rtv1,rtv2,rtv3,rtv4,rtv5,rtv6,rtv7,rtv8,rtv9,rtv10,rtv11,rtv12,rtvlen
vendor.rtv1.submitStatus=0x45
vendor.rtv3.submitStatus=0x45
vendor.rtv4.submitStatus=0x45
vendor.rtv5.submitStatus=0x45
vendor.rtv6.submitStatus=0x45
vendor.rtv7.submitStatus=0x45
vendor.rtv8.submitStatus=0x45
vendor.rtv9.submitStatus=0x45
vendor.rtv10.submitStatus=0x45
vendor.rtv11.submitStatus=0x45
vendor.rtv12.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# J-09：备份 1 的 RTVXX 不存在，跳到备份 2 的 RTV2
mt.1=OTP|8615000001201|rtv1>rtv2|channel -1 not in cm.cfg, next level&&[MT-REROUTE] level=2 from=9811 to=9812|DELIVRD
# J-16、J-17：主路由 + 10 级备份，前 10 个都失败，第 10 级 RTV2 成功（默认 SMSOptionMaxReroute=10，第 10 次改道允许）
mt.2=OTP|64210001202|rtv3>rtv4>rtv5>rtv6>rtv7>rtv8>rtv9>rtv10>rtv11>rtv12>rtv2|[MT-REROUTE] level=10 from=9822 to=9812|DELIVRD
# J-15、K-09：RTCUST5 只能改道 1 次：RTV1 → RTV3；RTV3 失败后不再改道，按重试策略（1M,1M 两个点 = 一共发两轮）1 分钟后重试主路由 RTV1；RTV1 再失败，改道次数已满、重试用完，回失败 DR
mt.3=OTP|8615000001203|rtv1>rtv3>rtv1|backup levels used up (level 1, rssid 9813): retried on the main route rssid 9811&&rerouted 1 times already, SMSOptionMaxReroute=1|!DELIVRD
mt.3.customer=rtcust5
mt.3.waitMs=240000
# J-10：备份 1 的 RTVLEN 不允许这么长的内容，跳到备份 2
mt.4=OTP|27820001204|rtv1>rtv2|rssid=9840: content length not allowed by channel 9840, next level&&[MT-REROUTE] level=2 from=9811 to=9812|DELIVRD
mt.4.text=this content is longer than the fifty bytes RTVLEN allows
