# RC015 DR 失败改道：要通道开 NeedDRReroute；逐级；没开、超时、级别用完：失败 DR 回客户；submit 改道后 DR 再改道
# 用例清单：L-01 L-02 L-04 L-05 L-06 L-07 L-08 L-14 L-15
case.id=RC015
case.title=DR 失败改道：要通道开 NeedDRReroute；逐级；没开、超时、级别用完：失败 DR 回客户；submit 改道后 DR 再改道
case.refs=L-01 L-02 L-04 L-05 L-06 L-07 L-08 L-14 L-15
vendors=rtvd1,rtvd2,rtvd3,rtvd4,rtvd5,rtv1,rtv2
mt.drWaitMs=90000
vendor.rtvd1.dr=UNDELIV
vendor.rtvd2.dr=DELIVRD
vendor.rtvd3.dr=UNDELIV
vendor.rtvd4.dr=UNDELIV
vendor.rtvd5.dr=UNDELIV
vendor.rtvd5.drDelayMs=3000
vendor.rtv1.submitStatus=0x45
vendor.rtv2.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# L-01：RTVD1 回 UNDELIV，改道到备份 RTVD2，客户只收到 RTVD2 的 DELIVRD（一个 DR）
mt.1=OTP|8613800001501|rtvd1>rtvd2|[MT-REROUTE] level=1 from=9851 to=9852|DELIVRD
# L-02、L-04：RTVD4 也 UNDELIV，没有下一级：失败 DR 回客户，不重试
mt.2=OTP|8615000001502|rtvd1>rtvd4|[MT-REROUTE] level=1 from=9851 to=9854|UNDELIV
# L-06：RTVD3 没开 NeedDRReroute：不改道，失败 DR 回客户
mt.3=OTP|64210001503|rtvd3||UNDELIV
# L-07：RTVD4 开了 NeedDRReroute 没配状态列表：任何失败都改道
mt.4=OTP|44770001504|rtvd4>rtvd2|[MT-REROUTE] level=1 from=9854 to=9852|DELIVRD
# L-05：DR 3 秒后才来，超过 RerouteDRDelayTimeInSec=1：不改道
mt.5=OTP|27820001505|rtvd5||UNDELIV
# L-14：submit 失败改道到 RTVD1（第 1 级），RTVD1 的 DR 失败从第 2 级接着找
mt.6=OTP|8616000001506|rtv1>rtvd1>rtvd2|[MT-REROUTE] level=1 from=9811 to=9851&&[MT-REROUTE] level=2 from=9851 to=9852|DELIVRD
# L-15：看这次发送的通道 RTVD3（没开 NeedDRReroute），不进第 2 级
mt.7=OTP|8617000001507|rtv2>rtvd3|[MT-REROUTE] level=1 from=9812 to=9853|UNDELIV
