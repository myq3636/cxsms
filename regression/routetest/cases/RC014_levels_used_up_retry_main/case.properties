# RC014 级别用完：按重试策略重试主路由的通道；主路由再失败不再走备份；RoutingLevel 写进 DB；CDR MsgID
# 用例清单：K-05 K-06 K-07 K-08 K-09 N-04 N-05b P-07
case.id=RC014
case.title=级别用完：按重试策略重试主路由的通道；主路由再失败不再走备份；RoutingLevel 写进 DB；CDR MsgID
case.refs=K-05 K-06 K-07 K-08 K-09 N-04 N-05b P-07
vendors=rtv1,rtv2,rtv3,rtv4,rtv5,rtv6
vendor.rtv1.submitStatusSeq=0x45,0
vendor.rtv2.submitStatus=0x45
vendor.rtv3.submitStatusSeq=0x45,0x0B
vendor.rtv4.submitStatus=0x45
vendor.rtv5.submitStatus=0x45
vendor.rtv6.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# K-05、K-08：RTV1 失败 → 备份 RTV2 失败 → 1 分钟后重试主路由 RTV1，这次成功
mt.1=OTP|8615000001401|rtv1>rtv2>rtv1|backup levels used up (level 1, rssid 9812): retried on the main route rssid 9811|DELIVRD
mt.1.waitMs=180000
mt.1.db=rmq:RSsID=9811,RoutingLevel=1
mt.1.cdr=OUT_SUBMIT={id};OUT_SUBMIT={id}-9812;OUT_SUBMIT={id};OUT_DELI_REP={id};IN_DELI_REP={id}
# K-07：重试主路由 RTV3 时回 0x0B（不在重试码里）：失败 DR
mt.2=OTP|64210001402|rtv3>rtv4>rtv3|not rerouted: status 2120 not in SMSOptionSubmitRetryCode of rssid 9813|!DELIVRD
mt.2.waitMs=180000
# K-06、K-09：重试主路由 RTV5 再失败，不再走备份 RTV6；重试策略 1M,1M（两个点 = 一共发两轮）用完，失败 DR，RTV6 只收到 1 次
mt.3=OTP|44770001403|rtv5>rtv6>rtv5|no backup level after level 1 (rssid=9815|!DELIVRD
mt.3.waitMs=240000
