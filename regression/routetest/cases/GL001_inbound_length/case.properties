# GL001 Core 入向长度检查：GSM 7-bit 按 GSM 字符数（≤160），ISO 按字节（≤140），NeedCheckMsgSize:false 不检查，模式 1 里 >0x7F 的字节打 WARN
# 用例清单：G7-01 G7-02 G7-03 G7-04 G7-05 G7-05b G7-05c G7-05d G7-06 G7-11 G7-12
case.id=GL001
case.title=Core 入向长度检查：GSM 7-bit 按 GSM 字符数（≤160），ISO 按字节（≤140），NeedCheckMsgSize:false 不检查，模式 1 里 >0x7F 的字节打 WARN
case.refs=G7-01 G7-02 G7-03 G7-04 G7-05 G7-05b G7-05c G7-05d G7-06 G7-11 G7-12
vendors=rtvg1,rtvg2,rtvg3,rtvg4,rtvg5,rtvg6
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# G7-01：160 个 ASCII 字符，模式 1
mt.1=OTP|8613800008001|rtvg1||DELIVRD
mt.1.customer=rtcg1
mt.1.enc=gsm7
mt.1.text=hello
mt.1.length=160
mt.1.segLens=160
mt.1.vendorDc=0
mt.1.vendorEnc=gsm7
mt.1.vendorText=same
# G7-02、G7-12：带 é，160 个 GSM 字符，模式 1：通过（改前 2250）；IN_SUBMIT、发往 7-bit 通道的 OUT_SUBMIT 字符集都是 ASCII
mt.2=OTP|8613800008002|rtvg1||DELIVRD
mt.2.customer=rtcg1
mt.2.enc=gsm7
mt.2.text=Café été
mt.2.length=160
mt.2.segLens=160
mt.2.vendorDc=0
mt.2.vendorEnc=gsm7
mt.2.vendorText=same
mt.2.cdr=IN_SUBMIT={id}~"ASCII";OUT_SUBMIT={id}~"ASCII"
# G7-03：带 é，160 个字符，模式 2（压缩，140 字节）
mt.3=OTP|8613800008003|rtvg1||DELIVRD
mt.3.customer=rtcg2
mt.3.enc=gsm7packed
mt.3.text=Café été
mt.3.length=160
mt.3.segLens=160
mt.3.vendorDc=0
mt.3.vendorEnc=gsm7
mt.3.vendorText=same
# G7-04：带 Δ（UCS2 字符），160 个字符，模式 1：通过（改前 2250）
mt.4=OTP|8613800008004|rtvg1||DELIVRD
mt.4.customer=rtcg1
mt.4.enc=gsm7
mt.4.text=Δelta
mt.4.length=160
mt.4.segLens=160
mt.4.vendorDc=0
mt.4.vendorEnc=gsm7
mt.4.vendorText=same
# G7-05：带 é，161 个字符：2250
mt.5=OTP|8613800008005|none||!DELIVRD
mt.5.customer=rtcg1
mt.5.enc=gsm7
mt.5.text=Café
mt.5.length=161
mt.5.cdr=OUT_SUBMIT={id}@2250
# G7-06a：é 加 5 个 `{`（扩展字符算 2 个），一共 160 个 GSM 字符：通过
mt.6=OTP|8613800008006|rtvg1||DELIVRD
mt.6.customer=rtcg1
mt.6.enc=gsm7
mt.6.text=Café {{{{{
mt.6.length=160
mt.6.vendorEnc=gsm7
mt.6.vendorText=same
# G7-06b：同上，161 个 GSM 字符：2250
mt.7=OTP|8613800008007|none||!DELIVRD
mt.7.customer=rtcg1
mt.7.enc=gsm7
mt.7.text=Café {{{{{
mt.7.length=161
mt.7.cdr=OUT_SUBMIT={id}@2250
# G7-05b：data_coding 3，160 字节 ISO：2250（和改前一样）
mt.8=OTP|8613800008008|none||!DELIVRD
mt.8.customer=rtcust
mt.8.enc=latin1
mt.8.text=Café
mt.8.length=160
mt.8.cdr=OUT_SUBMIT={id}@2250
# G7-05c：data_coding 3，140 字节 ISO：通过；发往 7-bit 通道仍是 ISO（不是 7-bit），data_coding 3
mt.9=OTP|8613800008009|rtvg1||DELIVRD
mt.9.customer=rtcust
mt.9.enc=latin1
mt.9.text=Café
mt.9.length=140
mt.9.segLens=140
mt.9.vendorDc=3
mt.9.vendorText=same
# G7-11：NeedCheckMsgSize:false，161 个字符也不检查
mt.10=OTP|8613800008010|rtvg1||DELIVRD
mt.10.customer=rtcg3
mt.10.enc=gsm7
mt.10.text=Café
mt.10.length=161
mt.10.vendorMatch=dest
# G7-05d：模式 1 里出现 0xE9：解析成 `?`（不改），Server 打一条 WARN
mt.11=OTP|8613800008011|rtvg1|{MultiSmppServer}[GSM7] ossid=9961 SMSOptionSupportIncomingGSM7bit=1: 1 byte(s) above 0x7F|DELIVRD
mt.11.customer=rtcg1
mt.11.enc=gsm7
mt.11.hex=436166E9
mt.11.vendorEnc=gsm7
mt.11.vendorText=Caf? {text}
