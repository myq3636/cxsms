# FD005 长短信 3 段 + 方式 1 / 方式 2：每段一条 DR、不重复；旧配置 SMSOptionSendFakeDR、SMSOptionSendDRBeforeOutSubmitInDC 不生效并 WARN
# 用例清单：FN-13 FN-14
case.id=FD005
case.title=长短信 3 段 + 方式 1 / 方式 2：每段一条 DR、不重复；旧配置 SMSOptionSendFakeDR、SMSOptionSendDRBeforeOutSubmitInDC 不生效并 WARN
case.refs=FN-13 FN-14
vendors=rtvf1,rtvf2,rtvf3,rtvf4,rtvf5
mt.drWaitMs=20000
vendor.rtvf4.submitStatus=0x45
vendor.rtvf5.submitStatus=0x0B
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# FN-13：方式 1 + 长短信：3 条 DR，不重复
mt.1=OTP|8613800004401|rtvf1|[FAKE-DR] mode=IN_SUBMIT|DELIVRD
mt.1.customer=rtcf1
mt.1.parts=3
mt.1.segments=rtvf1:3
mt.1.drCount=3
# FN-13：方式 2 + 长短信：3 条 DR，不重复
mt.2=OTP|8616000004402|rtvf2|[FAKE-DR] mode=OUT_SUBMIT|DELIVRD
mt.2.customer=rtcf5
mt.2.parts=3
mt.2.segments=rtvf2:3
mt.2.drCount=3
# FN-14：客户配了旧的 SMSOptionSendFakeDR=true，不回假 DR，真实 DR 转发
mt.3=OTP|8613800004403|rtvf1|![FAKE-DR]|UNDELIV
mt.3.customer=rtcf11
mt.3.vendorDr=UNDELIV
mt.3.drCount=1
check.log.1=CoreEngine1|RTCF11: SMSOptionSendFakeDR is no longer used
check.log.2=CoreEngine1|RTVF6: SMSOptionSendDRBeforeOutSubmitInDC is no longer supported
