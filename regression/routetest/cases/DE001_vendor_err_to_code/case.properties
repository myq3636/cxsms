# DE001 通道 DR → 内部错误码：stat+err、范围、TLV 优先、只按状态、DELIVRD 不看 err、只按 err、[DEFAULT] 块、对不上、欠费码优先
# 用例清单：DE-01 DE-02 DE-03 DE-04 DE-11 DE-13
case.id=DE001
case.title=通道 DR → 内部错误码：stat+err、范围、TLV 优先、只按状态、DELIVRD 不看 err、只按 err、[DEFAULT] 块、对不上、欠费码优先
case.refs=DE-01 DE-02 DE-03 DE-04 DE-11 DE-13
vendors=rtve1,rtve2,rtve3,rtve4,rtve5
customer.user=rtce1
vendor.rtve4.submitStatus=0x0B
vendor.rtve5.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# DE-01：stat+err 完全相等 → 101（10402）
mt.1=OTP|8613800003001|rtve1|[DR-ERR] rssid=9871 vendor=stat=UNDELIV;err=001&&code=101 status=10402|UNDELIV
mt.1.vendorDr=UNDELIV
mt.1.vendorDrErr=001
mt.1.drErr=101
# 10.3、10.4 第 3 步：err 5 按数值落在 002~009 → 104（10405）
mt.2=OTP|8613800003002|rtve1|[DR-ERR] rssid=9871 vendor=stat=UNDELIV;err=5&&code=104 status=10405|UNDELIV
mt.2.vendorDr=UNDELIV
mt.2.vendorDrErr=5
mt.2.drErr=104
# DE-02：带 network_error_code 3:001B，TLV 规则先于 stat+err（err 001 本来是 101）→ 103
mt.3=OTP|8613800003003|rtve1|nec=3:001B&&code=103 status=10402|UNDELIV
mt.3.vendorDr=UNDELIV
mt.3.vendorDrErr=001
mt.3.vendorTlv=03001B
mt.3.drErr=103
# 只写 Stat 的规则：REJECTD 其他 err → 202（10500），客户 stat:REJECTD
mt.4=OTP|8613800003004|rtve1|code=202 status=10500|REJECTD
mt.4.vendorDr=REJECTD
mt.4.vendorDrErr=050
mt.4.drErr=202
# 只写 Stat：UNDELIV 其他 err → 200（10400）
mt.5=OTP|8613800003005|rtve1|code=200 status=10400|UNDELIV
mt.5.vendorDr=UNDELIV
mt.5.vendorDrErr=099
mt.5.drErr=200
# 10.4：DELIVRD 不看 err（err 005 也是 000）
mt.6=OTP|8613800003006|rtve1|code=000 status=10000|DELIVRD
mt.6.vendorDr=DELIVRD
mt.6.vendorDrErr=005
mt.6.drErr=000
# DE-04、10.4 第 4 步（没写 Stat，err 相等）先于第 6 步（只写 Stat）：088 → 404 欠费（REJECTED_BYNC 10800）；客户回执的 stat 按内部状态，10800 是 DELETED（原有行为，5.2）
mt.7=OTP|8613800003007|rtve1|code=404 status=10800|DELETED
mt.7.vendorDr=UNDELIV
mt.7.vendorDrErr=088
mt.7.drErr=404
# RTVE2 没有自己的块，用 [DEFAULT] 块：077 → 103
mt.8=OTP|8615000003008|rtve2|[DR-ERR] rssid=9872 vendor=stat=UNDELIV;err=077&&code=103 status=10402|UNDELIV
mt.8.vendorDr=UNDELIV
mt.8.vendorDrErr=077
mt.8.drErr=103
# DE-03：对不上：状态不变（10400），码取这个状态的码 200，WARN [DR-ERR-UNMAPPED]
mt.9=OTP|8615000003009|rtve2|[DR-ERR-UNMAPPED] rssid=9872 channel=RTVE2 vendor=stat=UNDELIV;err=055&&code=200 status=10400|UNDELIV
mt.9.vendorDr=UNDELIV
mt.9.vendorDrErr=055
mt.9.drErr=200
# DE-13：RTVE3 的 SMSOptionDRNotPaidCode:088 先于它块里的 (Err=088,Code=101)：欠费 404，客户 stat:DELETED
mt.10=OTP|8616000003010|rtve3|(SMSOptionDRNotPaidCode)&&code=404|DELETED
mt.10.vendorDr=UNDELIV
mt.10.vendorDrErr=088
mt.10.drErr=404
