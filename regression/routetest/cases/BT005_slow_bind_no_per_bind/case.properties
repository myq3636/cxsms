# BT005 对照：没配 bind 级，同样一个 bind 慢：轮到它时整批推迟 100 ms，发得慢很多（原有行为）
# 用例清单：BR-09b
case.id=BT005
case.title=对照：没配 bind 级，同样一个 bind 慢：轮到它时整批推迟 100 ms，发得慢很多（原有行为）
case.refs=BR-09b
vendors=rtvb5
vendor.rtvb5.minLinks=4
vendor.rtvb5.slowFirstLink=true
vendor.rtvb5.respDelayMs=3000
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 100 条，每 10 ms 一条
mt.1=OTP|8613800007401|rtvb5||DELIVRD
mt.1.count=100
mt.1.after=10
mt.1.spanMs=5000,60000
mt.1.waitMs=90000
