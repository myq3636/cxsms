# RC018 CDR MsgID：主路由 msgId，备份通道 msgId-{ssid}，IN_DELI_REP 总是 msgId
# 用例清单：P-01 P-02 P-03 P-04 P-09
case.id=RC018
case.title=CDR MsgID：主路由 msgId，备份通道 msgId-{ssid}，IN_DELI_REP 总是 msgId
case.refs=P-01 P-02 P-03 P-04 P-09
vendors=rtv1,rtv2,rtv3,rtv4,rtv5,rtvnr
vendor.rtv1.submitStatus=0x45
vendor.rtv2.submitStatus=0x45
vendor.rtv5.submitStatus=0x45
vendor.rtvnr.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# P-02、P-03、P-04：OUT_SUBMIT 依次 msgId、msgId-9812、msgId-9813；之后的 OUT_DELI_REP msgId-9813；IN_DELI_REP msgId
mt.1=OTP|8615000001801|rtv1>rtv2>rtv3|[MT-REROUTE] level=2 from=9812 to=9813|DELIVRD
mt.1.cdr=IN_SUBMIT={id};OUT_SUBMIT={id};OUT_SUBMIT={id}-9812;OUT_SUBMIT={id}-9813;OUT_DELI_REP={id}-9813;IN_DELI_REP={id}
# P-01：没改道，全部 msgId
mt.2=OTP|64210001802|rtv4|by main prefix=64 priority=10|DELIVRD
mt.2.cdr=IN_SUBMIT={id};OUT_SUBMIT={id};OUT_DELI_REP={id};IN_DELI_REP={id}
# P-09：备份 RTVNR 失败、不再改道，失败 DR 的 CDR 带 -9830
mt.3=OTP|44770001803|rtv5>rtvnr|status 2300 not in SMSOptionSubmitRetryCode of rssid 9830|!DELIVRD
mt.3.cdr=OUT_SUBMIT={id};OUT_SUBMIT={id}-9830
