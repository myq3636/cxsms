# RC013 改道码：失败码不在这次发送通道的 SMSOptionSubmitRetryCode 里，不改道、不重试，直接失败 DR
# 用例清单：K-01 K-02 K-03 K-04
case.id=RC013
case.title=改道码：失败码不在这次发送通道的 SMSOptionSubmitRetryCode 里，不改道、不重试，直接失败 DR
case.refs=K-01 K-02 K-03 K-04
vendors=rtv1,rtv2,rtv3,rtv4,rtvnr,rtv6
vendor.rtv1.submitStatus=0x0B
vendor.rtvnr.submitStatus=0x45
vendor.rtv4.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# K-01：RTV1 回 0x0B（2120，不在 2300,2500,2600 里），不进备份 RTV2
mt.1=OTP|8615000001301|rtv1|not rerouted: status 2120 not in SMSOptionSubmitRetryCode of rssid 9811|!DELIVRD
# K-04：RTVNR 没配重试码，任何失败都不改道
mt.2=OTP|64210001302|rtvnr|not rerouted: status 2300 not in SMSOptionSubmitRetryCode of rssid 9830|!DELIVRD
# K-02、K-03：RTV4 的 2300 在它的重试码里，改道到 RTVNR；RTVNR 的 2300 不在它的列表里（看这次发送的通道），不进备份 2 RTV6
mt.3=OTP|44770001303|rtv4>rtvnr|[MT-REROUTE] level=1 from=9814 to=9830&&status 2300 not in SMSOptionSubmitRetryCode of rssid 9830|!DELIVRD
