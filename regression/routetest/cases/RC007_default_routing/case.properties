# RC007 默认路由：没有自己路由文件的客户、客户规则都不命中时、默认路由的备份
# 用例清单：E-08 E-12 G-04 I-06 J-14 A-19 B-01
case.id=RC007
case.title=默认路由：没有自己路由文件的客户、客户规则都不命中时、默认路由的备份
case.refs=E-08 E-12 G-04 I-06 J-14 A-19 B-01
vendors=rtv1,rtv2,rtv4,rtv5,rtv6,rtv7
vendor.rtv6.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# RR-05：RTCUST3 没有自己的路由文件，用 RTSVC_default
mt.1=OTP|8613800000701|rtv1|by main prefix=86 priority=10 file=RTSVC_default|DELIVRD
mt.1.customer=rtcust3
# 默认路由的 64
mt.2=OTP|64210000702|rtv2|by main prefix=64 priority=10 file=RTSVC_default|DELIVRD
mt.2.customer=rtcust3
# I-06：默认路由也没有 44，备份也没有：路由失败，失败 DR
mt.3=OTP|44770000703|none|no backup route either|!DELIVRD
mt.3.customer=rtcust3
# RTCUST4 用自己的文件
mt.4=OTP|8613800000704|rtv4|by main prefix=8613 priority=10 file=RTCUST4|DELIVRD
mt.4.customer=rtcust4
# G-04、E-12：自己的规则排除了 BANK、自己的四层都不命中，看默认路由
mt.5=BANK|8613800000705|rtv1|by main prefix=86 priority=10 file=RTSVC_default|DELIVRD
mt.5.customer=rtcust4
# J-14：默认路由的通道 RTV6 回 0x45（2300，在重试码里），用默认路由的备份 1
mt.6=OTP|8615000000707|rtv6>rtv7|[MT-REROUTE] level=1 from=9816 to=9817&&by main backup1 prefix=8615 priority=10 file=RTSVC_default|DELIVRD
mt.6.customer=rtcust3
