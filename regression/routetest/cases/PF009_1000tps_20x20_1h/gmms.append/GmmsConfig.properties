# PF009: the metrics of every module written (INFO, gauges, counts by ssid, DB pool) for gw-metrics-agent and the
# Portal charts; put back after the run like the rest of the case's configuration
Metrics.Enable=true
Metrics.LogLevel=INFO
Metrics.Format=json
Metrics.PrintGauge=true
Metrics.Ssid.Enable=true
DB.PoolStats.Enable=true
