# RC016 DR 改道码：配了 SMSOptionDRRerouteCode 只有列表里的码改道；按细分后的内部状态判断；NotPaid 不改道
# 用例清单：L-03 L-16 L-17 L-18
case.id=RC016
case.title=DR 改道码：配了 SMSOptionDRRerouteCode 只有列表里的码改道；按细分后的内部状态判断；NotPaid 不改道
case.refs=L-03 L-16 L-17 L-18
vendors=rtvd6,rtvd7,rtvd8,rtvd2
vendor.rtvd6.dr=UNDELIV
vendor.rtvd6.drErr=001
vendor.rtvd7.dr=UNDELIV
vendor.rtvd7.drErr=005
vendor.rtvd8.dr=UNDELIV
vendor.rtvd8.drErr=077
vendor.rtvd2.dr=DELIVRD
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# L-16：RTVD6 的 UNDELIV err:001 是 10400，在列表里：改道
mt.1=OTP|8613800001601|rtvd6>rtvd2|[MT-REROUTE] level=1 from=9856 to=9852|DELIVRD
# L-17：RTVD7 的 err:005 按对照表细分成 104（10405），不在列表 10400 里：不改道（验收时看 evidence 里 Core 的 DR 状态是 10405）
mt.2=OTP|8615000001602|rtvd7||UNDELIV
# L-18：err:077 命中 SMSOptionDRNotPaidCode，变成 REJECTED_BYNC：不改道（RTVD8 的列表是 10400，没有 10800；L-18 的前提是“列表里没有这个码”。没配列表时任何失败都改道，欠费也改道）
mt.3=OTP|64210001603|rtvd8||!DELIVRD
