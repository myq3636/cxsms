# RC006 二次路由：同一号码短时间内第二次发走二次层；二次层不命中往下看
# 用例清单：B-07 B-08 J-13
case.id=RC006
case.title=二次路由：同一号码短时间内第二次发走二次层；二次层不命中往下看
case.refs=B-07 B-08 J-13
vendors=rtv1,rtv2,rtv3,rtv4,rtv5
customer.user=rtcust2
vendor.rtv4.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 第一次：号码不在二次路由缓存里，主路由；之后号码进缓存
mt.1=OTP|8613800000601|rtv1|by main prefix=86 priority=10|DELIVRD
# B-07：3 秒后同一号码，二次层
mt.2=OTP|8613800000601|rtv2|by second prefix=8613 priority=10|DELIVRD
mt.2.after=3000
# 第一次
mt.3=OTP|8615000000603|rtv1|by main prefix=86 priority=10|DELIVRD
# B-08：二次层 8615 只有 BANK 的规则，不命中，往下看主路由
mt.4=OTP|8615000000603|rtv1|by main prefix=86 priority=10|DELIVRD
mt.4.after=3000
# 第一次
mt.5=BANK|8615000000605|rtv1|by main prefix=86 priority=10|DELIVRD
# B-07：BANK 第二次，二次层 8615
mt.6=BANK|8615000000605|rtv3|by second prefix=8615 priority=10|DELIVRD
mt.6.after=3000
# 第一次
mt.7=OTP|8616000000607|rtv1|by main prefix=86 priority=10|DELIVRD
# J-13：第二次走二次层的 RTV4，RTV4 失败，用二次层的备份 1 RTV5（不是普通层备份 1 的 RTV6）
mt.8=OTP|8616000000607|rtv4>rtv5|by second prefix=8616 priority=10&&[MT-REROUTE] level=1 from=9814 to=9815 code=2300 attempt=1 by second backup1 prefix=8616|DELIVRD
mt.8.after=3000
