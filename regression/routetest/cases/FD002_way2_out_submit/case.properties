# FD002 方式 2（通道 submit_sm_resp 成功就回）：通道开、客户拒绝、通道的前缀和延迟、外发失败、之后的真实 DR（含 EXPIRED，DEF-C9）只记 CDR
# 用例清单：FN-05 FN-06
case.id=FD002
case.title=方式 2（通道 submit_sm_resp 成功就回）：通道开、客户拒绝、通道的前缀和延迟、外发失败、之后的真实 DR（含 EXPIRED，DEF-C9）只记 CDR
case.refs=FN-05 FN-06
vendors=rtvf1,rtvf2,rtvf3,rtvf4,rtvf5
mt.drWaitMs=20000
vendor.rtvf4.submitStatus=0x45
vendor.rtvf5.submitStatus=0x0B
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# FN-05：外发成功回假 DR；真实 UNDELIV 只记 OUT_DELI_REP
mt.1=OTP|8616000004101|rtvf2|[FAKE-DR] mode=OUT_SUBMIT ossid=9895 rssid=9912&&[DR-SKIP] ossid=9895 status=10400|DELIVRD
mt.1.customer=rtcf5
mt.1.vendorDr=UNDELIV
mt.1.drCount=1
mt.1.cdr=OUT_DELI_REP={id}@10400
# FN-05：客户 SMSOptionFakeDRDisable=true，不回假 DR，真实 DR 转发
mt.2=OTP|8616000004102|rtvf2|![FAKE-DR]|UNDELIV
mt.2.customer=rtcf6
mt.2.vendorDr=UNDELIV
mt.2.drCount=1
# FN-05：通道前缀 86170 内，通道延迟 3 秒（`SMSOptionDRDelayTimeMinMaxInSec:3,3`；只写一个数 `3` 是 0～3 秒随机，原有的写法）
mt.3=OTP|8617000004103|rtvf3|[FAKE-DR] mode=OUT_SUBMIT ossid=9895 rssid=9913&&delaySec=3|DELIVRD
mt.3.customer=rtcf5
mt.3.vendorDr=UNDELIV
mt.3.drCount=1
mt.3.drDelayMs=2500,9000
# FN-05：86171 不在通道前缀里，真实 DR 转发
mt.4=OTP|8617100004104|rtvf3|![FAKE-DR]|UNDELIV
mt.4.customer=rtcf5
mt.4.vendorDr=UNDELIV
mt.4.drCount=1
# FN-05：外发失败（这条 MT 通道回 0x0B，不在重试码里）不回假 DR，回失败 DR
mt.5=OTP|8616000004105|rtvf2|![FAKE-DR]|!DELIVRD
mt.5.customer=rtcf5
mt.5.vendorSubmitStatus=0x0B
mt.5.drCount=1
# FN-06、DEF-C9：之后通道回 EXPIRED，只记 OUT_DELI_REP，不回第二条
mt.6=OTP|8616000004106|rtvf2|[FAKE-DR] mode=OUT_SUBMIT|DELIVRD
mt.6.customer=rtcf5
mt.6.vendorDr=EXPIRED
mt.6.drCount=1
mt.6.cdr=OUT_DELI_REP={id}
