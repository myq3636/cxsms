# DE002 内部码 → 客户：没有客户块（legacy）、passthrough、CustomerErr 精确和范围、vendor、000、DRErrTLV、旧配置 SMSOptionSmppMapErrCod4DR
# 用例清单：DE-05 DE-06 DE-13
case.id=DE002
case.title=内部码 → 客户：没有客户块（legacy）、passthrough、CustomerErr 精确和范围、vendor、000、DRErrTLV、旧配置 SMSOptionSmppMapErrCod4DR
case.refs=DE-05 DE-06 DE-13
vendors=rtve1,rtve2,rtve3,rtve4,rtve5
vendor.rtve4.submitStatus=0x0B
vendor.rtve5.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 没有客户块：legacy 表，10405 → 016
mt.1=OTP|8613800003101|rtve1|code=104 status=10405|UNDELIV
mt.1.vendorDr=UNDELIV
mt.1.vendorDrErr=5
mt.1.customer=rtcust
mt.1.drErr=016
# passthrough：内部码 104；没配 DRErrTLV，没有 TLV
mt.2=OTP|8613800003102|rtve1|code=104|UNDELIV
mt.2.vendorDr=UNDELIV
mt.2.vendorDrErr=5
mt.2.customer=rtce1
mt.2.drErr=104
mt.2.drTlv=none
# CustomerErr 范围 100~199 → 033
mt.3=OTP|8613800003103|rtve1|code=104|UNDELIV
mt.3.vendorDr=UNDELIV
mt.3.vendorDrErr=5
mt.3.customer=rtce2
mt.3.drErr=033
# CustomerErr 精确的 101 先于范围 → 011
mt.4=OTP|8613800003104|rtve1|code=101|UNDELIV
mt.4.vendorDr=UNDELIV
mt.4.vendorDrErr=001
mt.4.customer=rtce2
mt.4.drErr=011
# vendor：通道原始的 err 5，补 0 到 3 位 → 005
mt.5=OTP|8613800003105|rtve1|code=104|UNDELIV
mt.5.vendorDr=UNDELIV
mt.5.vendorDrErr=5
mt.5.customer=rtce3
mt.5.drErr=005
# 000：永远 000
mt.6=OTP|8613800003106|rtve1|code=104|UNDELIV
mt.6.vendorDr=UNDELIV
mt.6.vendorDrErr=5
mt.6.customer=rtce4
mt.6.drErr=000
# DE-06：passthrough + DRErrTLV：err:104，另带 network_error_code 类型 3、值 104（0x0068）
mt.7=OTP|8613800003107|rtve1|code=104|UNDELIV
mt.7.vendorDr=UNDELIV
mt.7.vendorDrErr=5
mt.7.customer=rtce5
mt.7.drErr=104
mt.7.drTlv=030068
# DE-13：配了旧的 SMSOptionSmppMapErrCod4DR 的客户：不再生效，按 legacy → 016
mt.8=OTP|8613800003108|rtve1|code=104|UNDELIV
mt.8.vendorDr=UNDELIV
mt.8.vendorDrErr=5
mt.8.customer=rtce6
mt.8.drErr=016
check.log.1=CoreEngine1|RTCE6: SMSOptionSmppMapErrCod4DR is no longer used
