# LS001 长短信：UDH / SAR 两种发法、通道不同的拆法（3 段、4 段、SAR）、每种 CDR 的条数、客户每段一条 DR
# 用例清单：流程说明第 8 节；测试报告第 2 节 A、B、C；第 3 节的修复
case.id=LS001
case.title=长短信：UDH / SAR 两种发法、通道不同的拆法（3 段、4 段、SAR）、每种 CDR 的条数、客户每段一条 DR
case.refs=流程说明第 8 节；测试报告第 2 节 A、B、C；第 3 节的修复
vendors=rtvl1,rtvl2,rtvl3
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# 3 段 UDH，通道按 160 拆回 3 段
mt.1=OTP|8613800009001|rtvl1|[MT-ROUTE] ossid=9801 rssid=9981|DELIVRD
mt.1.parts=3
mt.1.segments=rtvl1:3
mt.1.drCount=3
mt.1.drEachSeg=true
mt.1.cdrCount=IN_SUBMIT_PARTIAL:3,IN_SUBMIT:3,OUT_SUBMIT:3,OUT_DELI_REP:3,IN_DELI_REP:3
# 3 段 SAR 可选参数（Server 解析出参考号、总段数、段号），结果同上
mt.2=OTP|8613800009002|rtvl1|[MT-ROUTE] ossid=9801 rssid=9981|DELIVRD
mt.2.parts=3
mt.2.sar=true
mt.2.segments=rtvl1:3
mt.2.drCount=3
mt.2.drEachSeg=true
mt.2.cdrCount=IN_SUBMIT_PARTIAL:3,IN_SUBMIT:3,OUT_SUBMIT:3,OUT_DELI_REP:3,IN_DELI_REP:3
# 测试报告 B：通道按 100 拆成 4 段（每段 100 字节含 6 字节 UDH：94、94、94、86）：OUT_SUBMIT、OUT_DELI_REP 各 4 条，客户仍是 3 条 DR
mt.3=OTP|8615000009003|rtvl2|[MT-ROUTE] ossid=9801 rssid=9982|DELIVRD
mt.3.parts=3
mt.3.segments=rtvl2:4
mt.3.segLens=94,94,94,86
mt.3.drCount=3
mt.3.drEachSeg=true
mt.3.cdrCount=IN_SUBMIT_PARTIAL:3,IN_SUBMIT:3,OUT_SUBMIT:4,OUT_DELI_REP:4,IN_DELI_REP:3
# 通道 ChlUdhConcatenated:no：外发用 SAR 可选参数
mt.4=OTP|8616000009004|rtvl3|[MT-ROUTE] ossid=9801 rssid=9983|DELIVRD
mt.4.parts=3
mt.4.segments=rtvl3:3
mt.4.drCount=3
mt.4.drEachSeg=true
mt.4.cdrCount=IN_SUBMIT_PARTIAL:3,IN_SUBMIT:3,OUT_SUBMIT:3,OUT_DELI_REP:3,IN_DELI_REP:3
# 测试报告 C（对照）：单条短信
mt.5=OTP|8613800009005|rtvl1|[MT-ROUTE] ossid=9801 rssid=9981|DELIVRD
mt.5.drCount=1
mt.5.cdrCount=IN_SUBMIT_PARTIAL:0,IN_SUBMIT:1,OUT_SUBMIT:1,OUT_DELI_REP:1,IN_DELI_REP:1
