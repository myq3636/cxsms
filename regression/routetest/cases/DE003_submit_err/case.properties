# DE003 submit 失败的码：SubmitErr 精确、Status=*；客户的失败 DR 带这个码
# 用例清单：DE-08
case.id=DE003
case.title=submit 失败的码：SubmitErr 精确、Status=*；客户的失败 DR 带这个码
case.refs=DE-08
vendors=rtve1,rtve2,rtve3,rtve4,rtve5
vendor.rtve4.submitStatus=0x0B
vendor.rtve5.submitStatus=0x45
# mt.N = 发送方 | 号码 | 预期通道（a>b 依次收到；(a|b) 其中一个；none 不发出） | Core 日志里要有的文本（&& 分开，都要有） | 客户收到的 DR（!DELIVRD = 任何失败）
# DE-08：0x0B → 102，passthrough 客户收到 err:102
mt.1=OTP|8617000003201|rtve4|rssid=9874 vendor=submit=&&code=102 (submit)|!DELIVRD
mt.1.customer=rtce1
mt.1.drErr=102
# 0x45 → Status=* → 601
mt.2=OTP|8618000003202|rtve5|rssid=9875 vendor=submit=&&code=601 (submit)|!DELIVRD
mt.2.customer=rtce1
mt.2.drErr=601
# 没有客户块（legacy）：102 的内部状态 10402 → 012
mt.3=OTP|8617000003203|rtve4|code=102 (submit)|!DELIVRD
mt.3.customer=rtcust
mt.3.drErr=012
